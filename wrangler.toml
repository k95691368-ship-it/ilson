# Cloudflare Pages 설정.
#
# 바인딩을 대시보드에서 손으로 넣지 않고 이 파일에 둔다. 그래야 세 가지가 좋다.
#   - 무엇이 연결되어 있는지가 코드와 함께 기록으로 남는다
#   - 배포본을 새로 만들 때 바인딩을 다시 클릭하지 않아도 된다
#   - 대시보드에서 누가 잘못 바꿔도 다음 배포에서 이 파일이 이긴다
#
# 단 하나, API 키는 여기 두지 않는다. 시크릿은 저장소에 들어가면 안 되므로
# 대시보드의 Variables and Secrets에만 등록한다.

name = "ilson"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# 신청서·협의안·제작 기록·평가·성과가 전부 여기 들어간다.
[[d1_databases]]
binding = "DB"
database_name = "ilson"
database_id = "5fb7c8cd-4138-4c11-9e07-b077e2c60284"

# R2 버킷(SOURCES)이 여기 있었다. 첨부 기능을 걷어내면서 뺐다.
# 파일은 브라우저 안에서만 읽고 합친다 — 서버로 보내지 않으므로 보관할
# 것도 없다. 안 쓰는 바인딩을 남겨 두면 다음 사람이 "여기 파일이 쌓이는구나"로
# 읽고, /api/health 는 그 바인딩이 없다고 멀쩡한 배포를 고장으로 신고했다.
