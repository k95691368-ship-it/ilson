    <!--
      글꼴은 다른 도메인에서 받아 온다. 그 도메인에 처음 닿는 데만 DNS 조회와
      TLS 악수가 붙는데, 이 파일은 **첫 그림을 막는 파일**이라 그 시간이
      그대로 흰 화면이 된다. 미리 연결해 두면 그만큼 앞당겨진다.

      as="style" 은 rel="preload" 일 때만 뜻이 있는 값이라 뺐다. crossorigin
      도 뺐다 — 스타일시트에 붙이면 CORS 로 받아 오게 되는데 그럴 이유가 없다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!--
      글꼴 파일은 받되 **첫 그림을 막지 않는다.**

      스타일시트로 그냥 걸어 두면 브라우저는 그 파일이 남의 도메인에서 올
      때까지 아무것도 안 그린다. 흰 화면이 그만큼 길어진다.

      preload 로 받아 두었다가 다 받은 뒤에 스타일시트로 바꿔 단다. 그러면
      글자가 먼저 뜨고 글꼴이 나중에 갈아 끼워진다. 그렇게 해도 되는 이유가
      둘 있다 — 이 글꼴 파일 자체가 font-display:swap 이라 어차피 대체 글꼴로
      먼저 그리게 돼 있고, 우리 쪽 글꼴 목록도 system-ui 로 받아 두어서
      한글이 깨지지 않는다.

      자바스크립트를 끈 브라우저를 위해 noscript 로 원래 방식도 남긴다.
    -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <title>OverrideLoop — AI가 틀린 순간을, 조직의 다음 결정으로.</title>

    <!-- Google tag (gtag.js) -->
    <!--
      send_page_view 를 끈다.

      기본값으로 두면 태그가 첫 화면을 스스로 한 번 보내는데, 그때 보내는
      주소는 브라우저의 주소 표시줄 그대로다. 이 사이트의 주소에는 접수번호
      (/track?no=AX-…), 넘긴 도구 주소(/t/:slug), 신청서 id 가 들어간다.
      접수번호는 로그인이 없는 이 사이트에서 그 신청서를 여는 유일한 열쇠다 —
      그것을 구글로 보내면 안 된다.

      그래서 화면 이동은 React 쪽(src/lib/analytics.js)에서 열쇠를 가린
      주소로 직접 보낸다. 첫 화면도 거기서 보낸다.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VLP0X6V7TM"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-VLP0X6V7TM', { send_page_view: false })
    </script>

    <!-- Microsoft Clarity -->
    <!--
      클레어티는 애널리틱스와 성격이 다르다. 화면을 녹화한다. 어디를 눌렀고
      무엇이 떠 있었는지가 그대로 남는다.

      그래서 가릴 자리를 따로 잡아 뒀다(src/App.jsx). 부서 담당자가 여는 세
      화면 — 접수번호 조회, 넘겨받은 도구, 기록 문서 — 은 통째로 가린다.
      특히 도구 화면이 중요하다. 이 사이트는 "파일이 서버로 가지 않습니다"를
      내세우는데, 넣은 파일의 계산 결과가 화면에 뜨는 것을 녹화해 보내면 그
      약속이 뒷문으로 깨진다.

      입력칸에 친 값은 클레어티가 기본으로 가린다.
    -->
    <script type="text/javascript">
      ;(function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            ;(c[a].q = c[a].q || []).push(arguments)
          }
        t = l.createElement(r)
        t.async = 1
        t.src = 'https://www.clarity.ms/tag/' + i
        y = l.getElementsByTagName(r)[0]
        y.parentNode.insertBefore(t, y)
      })(window, document, 'clarity', 'script', 'y28b6n8ub2')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      첫 화면이 부를 것을 지금 띄워 둔다.

      여태 순서는 이랬다 — 자바스크립트를 받고, 실행하고, 그제서야 화면이
      뜨면서 서버를 부른다. 그때까지 서버는 놀고 있다. 이 파일은 맨 먼저
      도착하므로 여기서 걸어 두면 **받는 동안 서버가 같이 일한다.**

      첫 화면에서 쓰는 운영 데이터다. 다른 주소로 들어온 사람에게는 요청하지
      않고, 루트 화면의 자바스크립트를 받는 동안 서버가 먼저 준비한다.

      src/api/client.js 가 이걸 한 번만 꺼내 쓴다. 두 번째부터는 새로 부른다 —
      다시 부르는 것은 값이 바뀌었을까 봐 부르는 것이라, 미리 받아 둔 옛 답을
      주면 새로고침이 안 되는 화면이 된다.
    -->
    <script>
      if (location.pathname === '/') {
        window.__boot = {}
        for (const p of ['/override']) {
          // 실패하면 null 이 된다. 여기서 거절을 남기면 아무도 안 받는
          // 거절이 되어 브라우저 콘솔에 오류로 찍힌다. 화면은 null 을 보고
          // 그냥 제 손으로 다시 부른다.
          window.__boot[p] = fetch('/api' + p).catch(() => null)
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
