<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="사내 반복업무를 도구로 인수인계하는 시스템. 기준선을 실측해 봉인하고, 합격 시험을 통과한 도구만 주소를 받습니다."
    />
    <!--
      글꼴은 다른 도메인에서 받아 온다. 그 도메인에 처음 닿는 데만 DNS 조회와
      TLS 악수가 붙는데, 이 파일은 **첫 그림을 막는 파일**이라 그 시간이
      그대로 흰 화면이 된다. 미리 연결해 두면 그만큼 앞당겨진다.

      as="style" 은 rel="preload" 일 때만 뜻이 있는 값이라 뺐다. crossorigin
      도 뺐다 — 스타일시트에 붙이면 CORS 로 받아 오게 되는데 그럴 이유가 없다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>일손 — 사내 반복업무 인수인계 시스템</title>

    <!-- Google tag (gtag.js) -->
    <!--
      send_page_view 를 끈다.

      기본값으로 두면 태그가 첫 화면을 스스로 한 번 보내는데, 그때 보내는
      주소는 브라우저의 주소 표시줄 그대로다. 이 사이트의 주소에는 접수번호
      (/track?no=AX-…), 넘긴 도구 주소(/t/:slug), 신청서 id 가 들어간다.
      접수번호는 로그인이 없는 이 사이트에서 그 신청서를 여는 유일한 열쇠다 —
      그것을 구글로 보내면 안 된다.

      그래서 화면 이동은 React 쪽(src/lib/analytics.js)에서 열쇠를 가린
      주소로 직접 보낸다. 첫 화면도 거기서 보낸다.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VLP0X6V7TM"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-VLP0X6V7TM', { send_page_view: false })
    </script>

    <!-- Microsoft Clarity -->
    <!--
      클레어티는 애널리틱스와 성격이 다르다. 화면을 녹화한다. 어디를 눌렀고
      무엇이 떠 있었는지가 그대로 남는다.

      그래서 가릴 자리를 따로 잡아 뒀다(src/App.jsx). 부서 담당자가 여는 세
      화면 — 접수번호 조회, 넘겨받은 도구, 기록 문서 — 은 통째로 가린다.
      특히 도구 화면이 중요하다. 이 사이트는 "파일이 서버로 가지 않습니다"를
      내세우는데, 넣은 파일의 계산 결과가 화면에 뜨는 것을 녹화해 보내면 그
      약속이 뒷문으로 깨진다.

      입력칸에 친 값은 클레어티가 기본으로 가린다.
    -->
    <script type="text/javascript">
      ;(function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            ;(c[a].q = c[a].q || []).push(arguments)
          }
        t = l.createElement(r)
        t.async = 1
        t.src = 'https://www.clarity.ms/tag/' + i
        y = l.getElementsByTagName(r)[0]
        y.parentNode.insertBefore(t, y)
      })(window, document, 'clarity', 'script', 'y28b6n8ub2')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
