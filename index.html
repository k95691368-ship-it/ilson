<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="사내 반복업무를 도구로 인수인계하는 시스템. 기준선을 실측해 봉인하고, 합격 시험을 통과한 도구만 주소를 받습니다."
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>일손 — 사내 반복업무 인수인계 시스템</title>

    <!-- Google tag (gtag.js) -->
    <!--
      send_page_view 를 끈다.

      기본값으로 두면 태그가 첫 화면을 스스로 한 번 보내는데, 그때 보내는
      주소는 브라우저의 주소 표시줄 그대로다. 이 사이트의 주소에는 접수번호
      (/track?no=AX-…), 넘긴 도구 주소(/t/:slug), 신청서 id 가 들어간다.
      접수번호는 로그인이 없는 이 사이트에서 그 신청서를 여는 유일한 열쇠다 —
      그것을 구글로 보내면 안 된다.

      그래서 화면 이동은 React 쪽(src/lib/analytics.js)에서 열쇠를 가린
      주소로 직접 보낸다. 첫 화면도 거기서 보낸다.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TS0R5KYWWW"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-TS0R5KYWWW', { send_page_view: false })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
