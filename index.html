    <title>OverrideLoop — AI가 틀린 순간을, 조직의 다음 결정으로.</title>

    <!-- Google tag (gtag.js) -->
    <!--
      send_page_view 를 끈다.

      기본값으로 두면 태그가 첫 화면을 스스로 한 번 보내는데, 그때 보내는
      주소는 브라우저의 주소 표시줄 그대로다. 이 사이트의 주소에는 접수번호
      (/track?no=AX-…), 넘긴 도구 주소(/t/:slug), 신청서 id 가 들어간다.
      접수번호는 로그인이 없는 이 사이트에서 그 신청서를 여는 유일한 열쇠다 —
      그것을 구글로 보내면 안 된다.

      그래서 화면 이동은 React 쪽(src/lib/analytics.js)에서 열쇠를 가린
      주소로 직접 보낸다. 첫 화면도 거기서 보낸다.
    -->
    <script defer src="/bootstrap.js"></script>

    <!-- Microsoft Clarity -->
    <!--
      클레어티는 애널리틱스와 성격이 다르다. 화면을 녹화한다. 어디를 눌렀고
      무엇이 떠 있었는지가 그대로 남는다.

      그래서 가릴 자리를 따로 잡아 뒀다(src/App.jsx). 부서 담당자가 여는 세
      화면 — 접수번호 조회, 넘겨받은 도구, 기록 문서 — 은 통째로 가린다.
      특히 도구 화면이 중요하다. 이 사이트는 "파일이 서버로 가지 않습니다"를
      내세우는데, 넣은 파일의 계산 결과가 화면에 뜨는 것을 녹화해 보내면 그
      약속이 뒷문으로 깨진다.

      입력칸에 친 값은 클레어티가 기본으로 가린다.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      첫 화면이 부를 것을 지금 띄워 둔다.

      여태 순서는 이랬다 — 자바스크립트를 받고, 실행하고, 그제서야 화면이
      뜨면서 서버를 부른다. 그때까지 서버는 놀고 있다. 이 파일은 맨 먼저
      도착하므로 여기서 걸어 두면 **받는 동안 서버가 같이 일한다.**

      첫 화면에서 쓰는 운영 데이터다. 다른 주소로 들어온 사람에게는 요청하지
      않고, 루트 화면의 자바스크립트를 받는 동안 서버가 먼저 준비한다.

      src/api/client.js 가 이걸 한 번만 꺼내 쓴다. 두 번째부터는 새로 부른다 —
      다시 부르는 것은 값이 바뀌었을까 봐 부르는 것이라, 미리 받아 둔 옛 답을
      주면 새로고침이 안 되는 화면이 된다.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
